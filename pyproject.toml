[project]
name = "imla"
version = "0.1.0"
description = "Imla — cross-platform local push-to-talk voice dictation desktop app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hassan Mahmood" }]
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.0",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
    "keyring>=24.0.0",
    # Vosk 0.3.45 dropped the macOS arm64 wheel on PyPI; 0.3.44 is the latest
    # universal2 build, so we pin to the floor of the supported range.
    "vosk>=0.3.44",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
wayland = [
    "evdev>=1.6.0; sys_platform == 'linux'",
]

[project.scripts]
imla = "imla.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["imla"]

[tool.setuptools.package-data]
imla = ["vocab/*.txt"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
